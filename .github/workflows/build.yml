name: Build Homebridge UXC ARM64 Bundle

on:
  workflow_dispatch:
    inputs:
      homebridge_version:
        required: false
        default: latest
      config_ui_version:
        required: false
        default: latest

  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    env:
      BUNDLE_NAME: homebridge-arm64.tar.gz
      HB_VERSION: ${{ github.event.inputs.homebridge_version || 'latest' }}
      UI_VERSION: ${{ github.event.inputs.config_ui_version || 'latest' }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y jq wget tar gzip

      - name: Create bundle
        run: |
          mkdir -p bundle/rootfs

      - name: Download Alpine ARM64
        run: |
          wget -q \
          https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/alpine-minirootfs-latest-aarch64.tar.gz \
          -O alpine.tar.gz

          tar -xzf alpine.tar.gz -C bundle/rootfs

      - name: Install Homebridge
        run: |
          sudo chroot bundle/rootfs /bin/sh <<EOF
          apk update
          apk add nodejs npm tini bash ca-certificates
          npm install -g homebridge@${HB_VERSION}
          npm install -g homebridge-config-ui-x@${UI_VERSION}
          EOF

      - name: Create init
        run: |
          cat > bundle/rootfs/init <<'EOF'
#!/bin/sh
exec /sbin/tini -- homebridge -U /homebridge
EOF

          chmod +x bundle/rootfs/init

      - name: Create OCI config
        run: |
          jq -n '
          {
            ociVersion:"1.0.2",
            hostname:"homebridge",
            process:{
              terminal:true,
              cwd:"/homebridge",
              args:["/init"],
              env:[
                "HOME=/root",
                "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                "NODE_ENV=production",
                "NODE_OPTIONS=--max-old-space-size=256",
                "HOMEBRIDGE_CONFIG_UI=1",
                "HOMEBRIDGE_CONFIG_UI_HOST=0.0.0.0"
              ],
              user:{
                uid:0,
                gid:0
              }
            },
            root:{
              path:"rootfs",
              readonly:false
            },
            mounts:[
              {
                destination:"/proc",
                type:"proc",
                source:"proc"
              },
              {
                destination:"/dev",
                type:"tmpfs",
                source:"tmpfs"
              }
            ],
            linux:{
              namespaces:[
                {type:"pid"},
                {type:"network"},
                {type:"ipc"},
                {type:"uts"},
                {type:"mount"}
              ]
            }
          }' > bundle/config.json

      - name: Validate
        run: |
          jq . bundle/config.json
          test -x bundle/rootfs/init

      - name: Package
        run: |
          tar -czf "$BUNDLE_NAME" bundle

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Homebridge UXC ARM64
          files: homebridge-arm64.tar.gz
