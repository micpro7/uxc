name: Build Native ARM64 UXC Bundle

on:
  push:
    branches: [ main ]
    paths:
      - 'bundle/config.template.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-release:
    name: Compile ARM64 Rootfs & Publish
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Reproducible Release Tag
        id: vars
        run: |
          set -euo pipefail
          echo "VERSION=$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Fetch Alpine 3.22 Minirootfs
        run: |
          set -euo pipefail
          mkdir -p bundle/rootfs
          
          # Pinned for strict reproducibility
          ALPINE_VERSION="3.22.2"
          echo "Downloading Alpine Linux v${ALPINE_VERSION}..."
          
          wget -qO alpine.tar.gz "https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-${ALPINE_VERSION}-aarch64.tar.gz"
          
          echo "Extracting payload with strict permissions..."
          sudo tar --same-owner --same-permissions -xf alpine.tar.gz -C bundle/rootfs
          rm alpine.tar.gz

      - name: Prepare Chroot Environment (Mount Pseudo-FS)
        run: |
          set -euo pipefail
          sudo cp /etc/resolv.conf bundle/rootfs/etc/resolv.conf
          
          # Mount kernel pseudo-filesystems required by apk and npm
          sudo mount --bind /dev bundle/rootfs/dev
          sudo mount --bind /dev/pts bundle/rootfs/dev/pts
          sudo mount -t proc proc bundle/rootfs/proc
          sudo mount -t sysfs sys bundle/rootfs/sys

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            apk update
            apk upgrade --no-cache
            apk add --no-cache \
              nodejs \
              npm \
              tini \
              curl \
              jq \
              tzdata \
              ca-certificates \
              bash
          "

      - name: Install Homebridge Core & UI
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            npm install -g \
              --unsafe-perm \
              --omit=dev \
              --omit=optional \
              --no-audit \
              --no-fund \
              homebridge@latest \
              homebridge-config-ui-x@latest
          "

      - name: Initialize OCI Runtime Directories & Timezone
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            mkdir -p /run /var/run /var/lib/homebridge /var/log /etc/homebridge
            cp /usr/share/zoneinfo/UTC /etc/localtime
            echo UTC >/etc/timezone
          "

      - name: Health Checks & Bundle Optimization
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            echo '--- Running Health Checks ---'
            which node && node -v
            which npm && npm -v
            which homebridge && homebridge --version
            
            # Tolerant checks for Config UI X service
            which hb-service || true
            hb-service --version || true
            
            echo '--- Purging Build Caches & Temp Files ---'
            npm cache clean --force
            rm -rf /root/.npm
            rm -rf /usr/lib/node_modules/npm/docs
            rm -rf /usr/lib/node_modules/npm/html
            rm -rf /var/cache/apk/*
            find /tmp -mindepth 1 -delete
            find /var/tmp -mindepth 1 -delete
          "

      - name: Cleanup Host Mounts & Verify
        if: always()
        run: |
          set -euo pipefail
          # Safely unmount in reverse order
          sudo umount bundle/rootfs/dev/pts || true
          sudo umount bundle/rootfs/dev || true
          sudo umount bundle/rootfs/proc || true
          sudo umount bundle/rootfs/sys || true
          
          sudo rm -f bundle/rootfs/etc/resolv.conf
          
          test -f bundle/config.template.json || (echo '❌ Missing config.template.json!' && exit 1)

      - name: Package Deterministic OCI Bundle
        run: |
          set -euo pipefail
          echo "Compressing bundle payload deterministically..."
          cd bundle
          sudo tar \
            --sort=name \
            --mtime='UTC 2026-01-01' \
            --numeric-owner \
            --owner=0 \
            --group=0 \
            -czf ../homebridge-arm64.tar.gz .

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Homebridge UXC Base - ${{ env.VERSION }}"
          body: |
            ### 🚀 Automated Native ARM64 Build
            Deterministic, immutable UXC bundle for OpenWrt.
            - **OS:** Alpine Linux 3.22 (aarch64)
            - **Core:** Node.js, npm, Tini, bash
            - **App:** `homebridge@latest`, `homebridge-config-ui-x@latest`
          files: homebridge-arm64.tar.gz
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
