name: Build Native ARM64 UXC Bundle

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      alpine_version:
        description: 'Alpine version'
        default: '3.22.5'
        type: string
      homebridge_version:
        description: 'Homebridge version'
        default: 'latest'
        type: string
      config_ui_version:
        description: 'Config UI X version'
        default: 'latest'
        type: string

permissions:
  contents: write

concurrency:
  group: homebridge-uxc
  cancel-in-progress: true

jobs:
  build-release:
    name: Compile ARM64 Rootfs & Publish
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve Environment Versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ALPINE_VER=${{ github.event.inputs.alpine_version }}" >> $GITHUB_ENV
            echo "HB_VER=${{ github.event.inputs.homebridge_version }}" >> $GITHUB_ENV
            echo "UI_VER=${{ github.event.inputs.config_ui_version }}" >> $GITHUB_ENV
          else
            echo "ALPINE_VER=3.22.5" >> $GITHUB_ENV
            echo "HB_VER=latest" >> $GITHUB_ENV
            echo "UI_VER=latest" >> $GITHUB_ENV
          fi

      - name: Fetch Alpine Minirootfs
        run: |
          set -euo pipefail
          mkdir -p bundle/rootfs
          
          echo "Requested Alpine Linux v${ALPINE_VER}..."
          ALPINE_MAJOR_MINOR=$(echo "${ALPINE_VER}" | cut -d. -f1,2)
          echo "ALPINE_BRANCH=${ALPINE_MAJOR_MINOR}" >> $GITHUB_ENV
          
          wget -qO alpine.tar.gz "https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_MAJOR_MINOR}/releases/aarch64/alpine-minirootfs-${ALPINE_VER}-aarch64.tar.gz"
          
          test -s alpine.tar.gz || { echo "❌ Failed to download Alpine minirootfs!"; exit 1; }
          
          echo "Extracting payload with strict permissions..."
          sudo tar --same-owner --same-permissions -xf alpine.tar.gz -C bundle/rootfs
          rm alpine.tar.gz

      - name: Prepare Chroot Environment (Mount Pseudo-FS & Inject DNS)
        run: |
          set -euo pipefail
          
          # 1. Mount pseudo-filesystems first (using lazy unmount preparation)
          sudo mount --bind /dev bundle/rootfs/dev
          sudo mount --bind /dev/pts bundle/rootfs/dev/pts
          sudo mount -t proc proc bundle/rootfs/proc
          sudo mount -t sysfs sys bundle/rootfs/sys
          
          # 2. Copy DNS configuration post-mount for reliable build resolution
          # Note: /etc/hosts from the GitHub runner is intentionally omitted 
          # to prevent leaking host-specific runner entries into the rootfs.
          sudo cp /etc/resolv.conf bundle/rootfs/etc/resolv.conf

      - name: Install System Dependencies & Build Tools
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            
            # Dynamically mirror official Alpine repository branches matching release version
            echo 'https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_BRANCH}/main' > /etc/apk/repositories
            echo 'https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_BRANCH}/community' >> /etc/apk/repositories
            
            apk update
            
            # Install system runtime libraries (using pax-utils for lddtree/scanelf utilities and retaining python3 for native builds; ffmpeg omitted for minimal footprint)
            apk add --no-cache \
              coreutils \
              nodejs \
              npm \
              tini \
              curl \
              jq \
              tzdata \
              ca-certificates \
              bash \
              file \
              pax-utils \
              eudev-libs \
              libexpat \
              libxml2 \
              libxcrypt-compat \
              libstdc++ \
              libgcc \
              musl \
              zlib \
              libuv \
              openssl \
              sqlite-libs \
              icu \
              icu-libs \
              icu-data-full \
              brotli-libs \
              c-ares \
              openssh-client \
              python3 \
              make \
              g++ \
              git \
              linux-headers
            
            update-ca-certificates
          "

      - name: Install Homebridge Core & UI + Bin Symlinks
        run: |
          set -euo pipefail
          echo "Installing homebridge@${HB_VER} and homebridge-config-ui-x@${UI_VER}..."
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            export NODE_ENV=production
            export HOME=/root
            export NODE_PATH=/usr/local/lib/node_modules
            export npm_config_cache=/tmp/npm-cache
            npm config set prefix /usr/local
            
            # Keep optional dependencies for plugin ecosystem compatibility
            npm install -g \
              --unsafe-perm=true \
              --omit=dev \
              --no-audit \
              --no-fund \
              homebridge@${HB_VER} \
              homebridge-config-ui-x@${UI_VER}

            ln -sf /usr/local/bin/homebridge /usr/bin/homebridge || true
            ln -sf /usr/local/bin/homebridge-config-ui-x /usr/bin/homebridge-config-ui-x || true
          "

      - name: Clean npm Install Cache & Verify
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            npm cache clean --force
            npm cache verify
            rm -rf /root/.npm /tmp/npm-cache /usr/local/share/.cache
          "

      - name: Inject System Directories, Symlinks & Init Scripts
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c '
            # Prepare clean runtime directory hierarchy
            mkdir -p \
              /usr/local/lib/node_modules \
              /usr/lib/node_modules \
              /etc/homebridge \
              /var/lib/homebridge \
              /var/lib/homebridge/accessories \
              /var/lib/homebridge/persist \
              /var/lib/homebridge/backups \
              /var/lib/homebridge/logs \
              /run \
              /var/run \
              /var/log

            # Hardening storage ownership and permissions
            chown -R root:root /var/lib/homebridge
            chmod 755 /var/lib/homebridge

            # Create alias redirect for legacy plugins hardcoded to /homebridge
            rm -rf /homebridge
            ln -s /var/lib/homebridge /homebridge

            # Generate default template configuration for UI auto-start
            cat > /etc/homebridge/default-config.json <<EOF
{
  "bridge": {
    "name": "Homebridge",
    "username": "0E:00:00:00:00:00",
    "port": 51826,
    "pin": "031-45-154"
  },
  "plugins": [
    "homebridge-config-ui-x"
  ],
  "platforms": [
    {
      "platform": "config",
      "name": "Config",
      "port": 8581,
      "auth": "form"
    }
  ]
}
EOF

            # Generate lightweight start.sh wrapper with explicit runtime HOME export
            cat > /etc/homebridge/start.sh <<"EOF"
#!/bin/sh
set -e

# Fast non-recursive persistent mount check for all Homebridge storage paths
mkdir -p \
  /var/lib/homebridge \
  /var/lib/homebridge/logs \
  /var/lib/homebridge/accessories \
  /var/lib/homebridge/persist \
  /var/lib/homebridge/backups

chown 0:0 \
  /var/lib/homebridge \
  /var/lib/homebridge/logs \
  /var/lib/homebridge/accessories \
  /var/lib/homebridge/persist \
  /var/lib/homebridge/backups

chmod 755 \
  /var/lib/homebridge \
  /var/lib/homebridge/logs \
  /var/lib/homebridge/accessories \
  /var/lib/homebridge/persist \
  /var/lib/homebridge/backups

# Initialize default configuration on clean volume mount
if [ ! -f /var/lib/homebridge/config.json ]; then
    echo "Initializing default config.json for Config UI X..."
    cp /etc/homebridge/default-config.json /var/lib/homebridge/config.json
    chmod 600 /var/lib/homebridge/config.json
    chown 0:0 /var/lib/homebridge/config.json
fi

# Explicitly ensure HOME points to persistent storage path for plugins expecting $HOME
export HOME=/var/lib/homebridge

exec "$@"
EOF
            chmod +x /etc/homebridge/start.sh

            # Shell syntax check to catch accidental script errors early
            /bin/sh -n /etc/homebridge/start.sh

            # Sudo shim for plugin compatibility inside container
            echo "#!/bin/sh" > /usr/bin/sudo
            echo "while [ \$# -gt 0 ]; do case \"\$1\" in -*) shift ;; *) break ;; esac; done" >> /usr/bin/sudo
            echo "exec \"\$@\"" >> /usr/bin/sudo
            chmod +x /usr/bin/sudo
            ln -sf /usr/bin/sudo /bin/sudo
          '

      - name: Purge Heavy Build Dependencies & Clean Cache
        run: |
          set -euo pipefail
          echo "Purging temporary build tools (preserving /lib/apk/db for runtime apk installs)..."
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            # Tolerant deletion in case package names drift between Alpine builds
            apk del --purge make g++ git linux-headers || true
            
            # Safe APK cache purge preserving package database integrity (/lib/apk/db)
            rm -rf /var/cache/apk/*
            rm -rf /var/lib/apk/lists/*
            apk cache clean 2>/dev/null || true
          "

      - name: Verify Rootfs ARM64 Binaries, Executables & Dynamic Libraries
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            echo '--- Rootfs Architecture ---'
            file /bin/busybox | grep -q aarch64 || {
              echo '❌ Rootfs is not ARM64!'
              exit 1;
            }
            
            echo '--- Dynamic Shared Library Tree Verification ---'
            lddtree /usr/bin/node || exit 1
            
            echo '--- Node Architecture & ICU Verification ---'
            NODE_ARCH=\$(node -p \"process.arch\")
            echo \"Detected Node architecture: \${NODE_ARCH}\"
            test \"\${NODE_ARCH}\" = \"arm64\" || { echo '❌ Node architecture mismatch!'; exit 1; }
            
            node -e \"console.log('ICU Locale Verification:', new Intl.DateTimeFormat().resolvedOptions())\"
            
            echo '--- Executable Command Checks ---'
            command -v node
            command -v npm
            command -v homebridge
            command -v homebridge-config-ui-x
            command -v tini
            tini --version
            
            test -x /usr/local/bin/homebridge || { echo '❌ /usr/local/bin/homebridge missing or not executable!'; exit 1; }
            test -x /usr/local/bin/homebridge-config-ui-x || { echo '❌ /usr/local/bin/homebridge-config-ui-x missing or not executable!'; exit 1; }
            test -x /etc/homebridge/start.sh || { echo '❌ /etc/homebridge/start.sh missing or not executable!'; exit 1; }
            
            echo '--- NPM Prefix & Root Verification ---'
            test \"\$(npm config get prefix)\" = \"/usr/local\" || { echo '❌ NPM prefix is incorrect!'; exit 1; }
            
            echo '--- Symlink Verification ---'
            test -L /homebridge || { echo '❌ /homebridge is not a symlink!'; exit 1; }
            
            echo '--- Module Existence Validation ---'
            test -d /usr/local/lib/node_modules/homebridge
            test -d /usr/local/lib/node_modules/homebridge-config-ui-x
          "

      - name: Initialize OCI Timezone (Europe/London)
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            cp /usr/share/zoneinfo/Europe/London /etc/localtime
            echo Europe/London >/etc/timezone
          "

      - name: First-Run Module Validation & Strict Daemon Smoke Test
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            export NODE_ENV=production
            export NODE_PATH=/usr/local/lib/node_modules
            
            echo '--- OCI Module Resolution & Health Check ---'
            node -v
            npm -v
            homebridge --version
            
            # Module health check catch for broken npm installations
            node -e \"require('homebridge')\"
            node -p \"'Config UI X Version: ' + require('/usr/local/lib/node_modules/homebridge-config-ui-x/package.json').version\"
            
            echo '--- Testing Plugin Loading & Strict Daemon Smoke Test ---'
            mkdir -p /tmp/test-homebridge
            
            set +e
            HOME=/tmp/test-homebridge \
            NODE_ENV=production \
            NODE_PATH=/usr/local/lib/node_modules \
            timeout 10 homebridge \
              -U /tmp/test-homebridge \
              -D
            EXIT_CODE=\$?
            set -e
            
            if [ \"\$EXIT_CODE\" != \"124\" ] && [ \"\$EXIT_CODE\" != \"0\" ]; then
              echo \"❌ Homebridge failed startup validation with exit code \$EXIT_CODE!\"
              exit 1
            fi
            
            echo \"✅ Smoke test passed with exit code \$EXIT_CODE (124 indicates clean daemon timeout)\"
            rm -rf /tmp/test-homebridge
            
            node -e \"require('homebridge-config-ui-x')\"
            
            test ! -e /var/lib/homebridge/config.json || { echo '❌ Found config.json inside rootfs image!'; exit 1; }
            test ! -e /var/lib/homebridge/.uix || { echo '❌ Found .uix marker inside rootfs image!'; exit 1; }
            
            echo '✅ Factory first-run appliance verified'
            
            echo '--- Purging Documentation & Temp Files ---'
            rm -rf /usr/lib/node_modules/npm/docs /usr/lib/node_modules/npm/html /usr/lib/node_modules/npm/man || true
            rm -rf /usr/share/man /usr/share/doc /usr/share/info
            find /usr/local/lib/node_modules -type f -name \"*.md\" -delete
            rm -rf /var/cache/apk/*
            find /tmp -mindepth 1 -delete
            find /var/tmp -mindepth 1 -delete
            rm -rf /root/.npm /usr/local/share/.cache
          "

      - name: Resolve Dynamic Release Version Tag
        run: |
          set -euo pipefail
          HB_VERSION=$(sudo chroot bundle/rootfs /bin/sh -c 'homebridge --version' | tr -d '\r\n')
          RELEASE_TAG="hb-${HB_VERSION}-alpine-${ALPINE_VER}-$(date +'%Y%m%d')"
          echo "VERSION=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "RESOLVED_HB_VER=${HB_VERSION}" >> $GITHUB_ENV

      - name: Generate OCI Specification config.json
        run: |
          set -euo pipefail
          echo "Writing embedded OCI config.json spec..."
          cat > bundle/config.json << 'EOF'
{
  "ociVersion": "1.0.2",
  "hostname": "hb",
  "process": {
    "terminal": false,
    "user": {
      "uid": 0,
      "gid": 0
    },
    "cwd": "/var/lib/homebridge",
    "capabilities": {
      "bounding": [
        "CAP_NET_RAW",
        "CAP_NET_BIND_SERVICE",
        "CAP_CHOWN"
      ],
      "effective": [
        "CAP_NET_RAW",
        "CAP_NET_BIND_SERVICE",
        "CAP_CHOWN"
      ],
      "permitted": [
        "CAP_NET_RAW",
        "CAP_NET_BIND_SERVICE",
        "CAP_CHOWN"
      ]
    },
    "rlimits": [
      {
        "type": "RLIMIT_NOFILE",
        "hard": 65536,
        "soft": 65536
      }
    ],
    "args": [
      "/sbin/tini",
      "--",
      "/etc/homebridge/start.sh",
      "/usr/local/bin/homebridge",
      "-U",
      "/var/lib/homebridge",
      "-P",
      "/usr/local/lib/node_modules"
    ],
    "env": [
      "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
      "LANG=C.UTF-8",
      "NODE_ENV=production",
      "HOME=/var/lib/homebridge",
      "NODE_PATH=/usr/local/lib/node_modules",
      "NODE_OPTIONS=--max-old-space-size=384",
      "TZ=Europe/London"
    ]
  },
  "root": {
    "path": "rootfs",
    "readonly": false
  },
  "linux": {
    "namespaces": [
      {
        "type": "pid"
      },
      {
        "type": "mount"
      },
      {
        "type": "ipc"
      },
      {
        "type": "uts"
      }
    ]
  }
}
EOF
          echo "Validating OCI config.json structure with JQ..."
          jq empty bundle/config.json || { echo '❌ Invalid JSON in config.json!'; exit 1; }
          echo "✅ Embedded OCI config.json written and validated."

      - name: Generate Build Summary Report
        run: |
          set -euo pipefail
          NODE_VER=$(sudo chroot bundle/rootfs /bin/sh -c 'node -v')
          NPM_VER=$(sudo chroot bundle/rootfs /bin/sh -c 'npm -v')
          UI_VER_INSTALLED=$(sudo chroot bundle/rootfs /bin/sh -c "node -p \"require('/usr/local/lib/node_modules/homebridge-config-ui-x/package.json').version\"" | tr -d '\r\n')
          
          {
            echo "### 🚀 Homebridge UXC Factory Appliance Manifest"
            echo "| Component | Version / Target |"
            echo "| :--- | :--- |"
            echo "| **OS Base** | Alpine Linux ${ALPINE_VER} (ARM64) |"
            echo "| **Timezone** | Europe/London |"
            echo "| **Memory Limit** | V8 Heap capped at 384MB (\`NODE_OPTIONS\`) |"
            echo "| **Networking** | Shared Host Network (mDNS via host OpenWrt Avahi) |"
            echo "| **Entrypoint** | \`/sbin/tini -- /etc/homebridge/start.sh /usr/local/bin/homebridge -U /var/lib/homebridge -P /usr/local/lib/node_modules\` |"
            echo "| **Node.js** | ${NODE_VER} |"
            echo "| **npm** | v${NPM_VER} |"
            echo "| **Homebridge Core** | v${RESOLVED_HB_VER} |"
            echo "| **Config UI X** | v${UI_VER_INSTALLED} |"
            echo "| **Release Tag** | \`${VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Host Mounts (Reverse Order Lazy Unmounts)
        if: always()
        run: |
          set -euo pipefail
          sudo umount -l bundle/rootfs/proc || true
          sudo umount -l bundle/rootfs/sys || true
          sudo umount -l bundle/rootfs/dev/pts || true
          sudo umount -l bundle/rootfs/dev || true

      - name: Package Deterministic OCI Bundle
        run: |
          set -euo pipefail
          echo "Compressing bundle payload deterministically..."
          cd bundle
          sudo tar \
            --sort=name \
            --mtime='@0' \
            --numeric-owner \
            --owner=0 \
            --group=0 \
            --pax-option=delete=atime,delete=ctime \
            -czf ../homebridge-arm64.tar.gz config.json rootfs
            
      - name: Generate Integrity Checksum
        run: |
          set -euo pipefail
          sha256sum homebridge-arm64.tar.gz > SHA256SUMS
          echo "✅ Checksum generated:"
          cat SHA256SUMS
            
      - name: Validate Factory Bundle Archive
        run: |
          set -euo pipefail
          test -s homebridge-arm64.tar.gz
          ARCHIVE_FILES=$(tar -tf homebridge-arm64.tar.gz)
          
          [[ "$ARCHIVE_FILES" =~ rootfs ]] || { echo "❌ 'rootfs' missing from archive!"; exit 1; }
          
          if tar -tf homebridge-arm64.tar.gz | grep -q "var/lib/homebridge/config.json"; then
            echo "❌ Factory image contains config.json"
            exit 1
          fi

          if tar -tf homebridge-arm64.tar.gz | grep -q "var/lib/homebridge/.uix"; then
            echo "❌ Factory image contains .uix marker"
            exit 1
          fi
          
          echo "✅ Factory first-run image confirmed"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homebridge-arm64-bundle
          path: |
            homebridge-arm64.tar.gz
            SHA256SUMS
          retention-days: 7

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Homebridge UXC Base - ${{ env.VERSION }}"
          body: |
            ### 🚀 Factory Appliance Native ARM64 Build
            Deterministic, clean appliance UXC bundle for OpenWrt.
            - **OS Base:** Alpine Linux ${{ env.ALPINE_VER }} (aarch64)
            - **Timezone:** Europe/London
            - **Memory Limit:** 384MB V8 heap ceiling (`NODE_OPTIONS`)
            - **Networking:** Host Network Mode (Relies on Host Avahi)
            - **Entrypoint:** `/etc/homebridge/start.sh /usr/local/bin/homebridge -U /var/lib/homebridge -P /usr/local/lib/node_modules`
            - **App Versions:** `homebridge@${{ env.RESOLVED_HB_VER }}`, `homebridge-config-ui-x@${{ env.UI_VER }}`
          files: |
            homebridge-arm64.tar.gz
            SHA256SUMS
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
