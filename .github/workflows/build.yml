name: Build UXC Homebridge Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y skopeo jq wget tar gzip file

      - name: Install umoci
        run: |
          wget -O umoci \
            https://github.com/opencontainers/umoci/releases/latest/download/umoci.linux.amd64
          sudo mv umoci /usr/local/bin/
          sudo chmod +x /usr/local/bin/umoci
          umoci --version

      - name: Convert Homebridge ARM64 Image to OCI Layout
        run: |
          HOMEBRIDGE_TAG="latest"
          skopeo copy \
            --override-arch arm64 \
            --format oci \
            docker://homebridge/homebridge:${HOMEBRIDGE_TAG} \
            oci:homebridge-oci:latest

      - name: Extract OCI Runtime Bundle
        run: |
          mkdir -p bundle
          umoci unpack \
            --rootless \
            --image homebridge-oci:latest \
            bundle

      - name: Verify ARM64 Binaries
        run: |
          file bundle/rootfs/usr/local/bin/node

      - name: Patch OCI config.json for UXC
        run: |
          jq '
            .process.capabilities.bounding |= ((. // []) + ["CAP_SYS_ADMIN", "CAP_NET_ADMIN"] | unique) |
            .process.capabilities.effective |= ((. // []) + ["CAP_SYS_ADMIN", "CAP_NET_ADMIN"] | unique) |
            .process.capabilities.permitted |= ((. // []) + ["CAP_SYS_ADMIN", "CAP_NET_ADMIN"] | unique) |

            .process.env |= ((. // []) + [
              "HOME=/homebridge",
              "HOMEBRIDGE_CONFIG_UI=1"
            ] | unique) |

            .mounts |= ((. // []) + [{
              "destination": "/homebridge",
              "type": "bind",
              "source": "/mnt/SSD/Config/OpenWRT/UXC/HomeBridge/data",
              "options": [
                "rbind",
                "rw"
              ]
            }])
          ' bundle/config.json > bundle/config.json.tmp \
          && mv bundle/config.json.tmp bundle/config.json

      - name: Package UXC Bundle
        run: |
          tar \
            -czvf homebridge-arm64.tar.gz \
            -C bundle \
            config.json \
            rootfs

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebridge-arm64
          path: homebridge-arm64.tar.gz

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Homebridge UXC ARM64 v1.0.${{ github.run_number }}"
          files: homebridge-arm64.tar.gz
          body: "Automated OCI runtime bundle for Homebridge ARM64 tailored for UXC on OpenWrt."
          draft: false
          prerelease: false
