name: Build Homebridge UXC ARM64 Bundle

on:
  workflow_dispatch:
    inputs:
      homebridge_version:
        description: Homebridge version
        required: false
        default: latest

      config_ui_version:
        description: Homebridge Config UI X version
        required: false
        default: latest

  schedule:
    - cron: "0 3 * * 0"


permissions:
  contents: write


env:
  BUNDLE_NAME: homebridge-arm64.tar.gz


jobs:
  build:

    name: Native ARM64 Homebridge UXC Build

    runs-on: ubuntu-24.04-arm


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup ARM64 build environment
        run: |
          sudo apt update
          sudo apt install -y \
            curl \
            tar \
            gzip \
            jq \
            rsync


      - name: Create root filesystem
        run: |
          mkdir -p bundle/rootfs


      - name: Install Node.js ARM64
        working-directory: bundle/rootfs
        run: |
          curl -fsSL https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-arm64.tar.xz \
          -o node.tar.xz

          tar -xf node.tar.xz

          mv node-v24.18.0-linux-arm64/usr/local/* usr/

          rm -rf node.tar.xz node-v24.18.0-linux-arm64


      - name: Create filesystem structure
        run: |
          mkdir -p \
            bundle/rootfs/etc \
            bundle/rootfs/homebridge \
            bundle/rootfs/root \
            bundle/rootfs/tmp \
            bundle/rootfs/var/lib/homebridge


      - name: Install Homebridge packages
        working-directory: bundle/rootfs
        run: |
          export PATH=$PWD/usr/bin:$PWD/usr/local/bin:$PATH

          npm install -g \
            --prefix /usr/local \
            homebridge@${{ github.event.inputs.homebridge_version || 'latest' }}

          npm install -g \
            --prefix /usr/local \
            homebridge-config-ui-x@${{ github.event.inputs.config_ui_version || 'latest' }}


      - name: Create Homebridge init
        run: |
          cat > bundle/rootfs/init <<'EOF'
#!/bin/sh

export HOME=/root
export PATH=/usr/local/bin:/usr/bin:/bin

mkdir -p /homebridge

exec hb-service run
EOF

          chmod +x bundle/rootfs/init


      - name: Copy OCI configuration
        run: |
          cp config.json bundle/config.json


      - name: Validate bundle
        run: |
          test -f bundle/config.json
          test -x bundle/rootfs/init

          jq empty bundle/config.json

          echo "UXC bundle validation successful"


      - name: Package UXC bundle
        run: |
          tar -czf "$BUNDLE_NAME" bundle


      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Homebridge UXC ARM64 Latest
          overwrite_files: true
          files: |
            ${{ env.BUNDLE_NAME }}
