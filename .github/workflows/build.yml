name: Build Homebridge UXC ARM64 Bundle

on:
  workflow_dispatch:
    inputs:
      homebridge_version:
        description: Homebridge version
        required: false
        default: latest
      config_ui_version:
        description: Config UI X version
        required: false
        default: latest

  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

env:
  IMAGE_NAME: homebridge-uxc-builder
  BUNDLE_NAME: homebridge-arm64.tar.gz

jobs:
  build:
    name: Build native ARM64 UXC bundle
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup build variables
        run: |
          echo "HB_VERSION=${{ github.event.inputs.homebridge_version || 'latest' }}" >> $GITHUB_ENV
          echo "UI_VERSION=${{ github.event.inputs.config_ui_version || 'latest' }}" >> $GITHUB_ENV


      - name: Build ARM64 image
        run: |
          docker build \
            --platform linux/arm64 \
            --build-arg HOMEBRIDGE_VERSION="$HB_VERSION" \
            --build-arg CONFIG_UI_VERSION="$UI_VERSION" \
            -t "$IMAGE_NAME" .


      - name: Create temporary container
        run: |
          docker create \
            --name hb-export \
            "$IMAGE_NAME"


      - name: Export root filesystem
        run: |
          mkdir -p bundle/rootfs

          docker export hb-export \
            | tar -x -C bundle/rootfs


      - name: Copy OCI config
        run: |
          cp config.json bundle/config.json


      - name: Validate bundle
        run: |
          test -f bundle/config.json
          test -d bundle/rootfs

          echo "Bundle OK"


      - name: Package UXC bundle
        run: |
          tar -czf "$BUNDLE_NAME" bundle


      - name: Delete old release
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            for (const release of releases.data) {
              if (release.tag_name === "latest") {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
              }
            }


      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Homebridge UXC ARM64 Latest
          files: |
            ${{ env.BUNDLE_NAME }}
