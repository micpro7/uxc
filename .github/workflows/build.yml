name: Build Homebridge UXC Bundle

on:
  workflow_dispatch:
    inputs:
      homebridge_version:
        description: "Homebridge version"
        required: false
        default: "latest"

      config_ui_version:
        description: "Homebridge Config UI X version"
        required: false
        default: "latest"

  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

env:
  BUNDLE_NAME: homebridge-arm64.tar.gz
  ALPINE_VERSION: "latest-stable"

jobs:

  build:

    # Change to:
    # runs-on: [self-hosted, Linux, ARM64]
    # if using your own ARM runner.
    runs-on: ubuntu-24.04-arm64

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          uname -a
          arch
          lscpu || true

      - name: Install build tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            jq \
            tar \
            xz-utils \
            ca-certificates \
            sudo

      - name: Download Alpine minirootfs
        run: |

          mkdir -p bundle/rootfs

          wget -O alpine.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/${ALPINE_VERSION}/releases/aarch64/alpine-minirootfs-${ALPINE_VERSION}-aarch64.tar.gz

          sudo tar \
            -xzf alpine.tar.gz \
            -C bundle/rootfs

      - name: Configure DNS inside rootfs
        run: |
          sudo cp /etc/resolv.conf \
            bundle/rootfs/etc/resolv.conf

      - name: Install Homebridge
        env:
          HB_VERSION: ${{ github.event.inputs.homebridge_version || 'latest' }}
          UI_VERSION: ${{ github.event.inputs.config_ui_version || 'latest' }}
        run: |

          sudo mount --bind /dev bundle/rootfs/dev
          sudo mount --bind /proc bundle/rootfs/proc
          sudo mount --bind /sys bundle/rootfs/sys

          sudo chroot bundle/rootfs /bin/sh <<EOF

          set -e

          apk update

          apk add \
              bash \
              tini \
              nodejs \
              npm \
              ca-certificates \
              tzdata \
              avahi-libs

          npm install -g \
              homebridge@${HB_VERSION}

          npm install -g \
              homebridge-config-ui-x@${UI_VERSION}

          mkdir -p /homebridge

          mkdir -p /var/log

          apk cache clean

          EOF

          sudo umount bundle/rootfs/dev
          sudo umount bundle/rootfs/proc
          sudo umount bundle/rootfs/sys

      - name: Copy runtime scripts
        run: |

          sudo cp scripts/init \
            bundle/rootfs/init

          sudo chmod +x \
            bundle/rootfs/init

          if [ -f scripts/healthcheck ]; then
            sudo cp scripts/healthcheck \
              bundle/rootfs/usr/local/bin/
          fi

      - name: Generate OCI template
        run: |

          cp bundle/config.template.json \
             bundle/config.json

      - name: Package bundle
        run: |

          tar \
            -czf "${BUNDLE_NAME}" \
            -C bundle .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2

        with:
          tag_name: latest
          make_latest: true
          name: Homebridge UXC Latest
          files: |
            ${{ env.BUNDLE_NAME }}
