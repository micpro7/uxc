name: Build Native ARM64 UXC Bundle

on:
  push:
    branches: [ main ]
    paths:
      - 'bundle/config.template.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      alpine_version:
        description: 'Alpine version'
        default: '3.22.2'
        type: string
      homebridge_version:
        description: 'Homebridge version'
        default: 'latest'
        type: string
      config_ui_version:
        description: 'Config UI X version'
        default: 'latest'
        type: string

permissions:
  contents: write

concurrency:
  group: homebridge-uxc
  cancel-in-progress: true

jobs:
  build-release:
    name: Compile ARM64 Rootfs & Publish
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve Environment Versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ALPINE_VER=${{ github.event.inputs.alpine_version }}" >> $GITHUB_ENV
            echo "HB_VER=${{ github.event.inputs.homebridge_version }}" >> $GITHUB_ENV
            echo "UI_VER=${{ github.event.inputs.config_ui_version }}" >> $GITHUB_ENV
          else
            echo "ALPINE_VER=3.22.2" >> $GITHUB_ENV
            echo "HB_VER=latest" >> $GITHUB_ENV
            echo "UI_VER=latest" >> $GITHUB_ENV
          fi

      - name: Fetch Alpine Minirootfs
        run: |
          set -euo pipefail
          mkdir -p bundle/rootfs
          
          echo "Requested Alpine Linux v${ALPINE_VER}..."
          ALPINE_MAJOR_MINOR=$(echo "${ALPINE_VER}" | cut -d. -f1,2)
          
          wget -qO alpine.tar.gz "https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_MAJOR_MINOR}/releases/aarch64/alpine-minirootfs-${ALPINE_VER}-aarch64.tar.gz"
          
          test -s alpine.tar.gz || { echo "❌ Failed to download Alpine minirootfs!"; exit 1; }
          
          echo "Extracting payload with strict permissions..."
          sudo tar --same-owner --same-permissions -xf alpine.tar.gz -C bundle/rootfs
          rm alpine.tar.gz

      - name: Prepare Chroot Environment (Mount Pseudo-FS)
        run: |
          set -euo pipefail
          sudo cp /etc/resolv.conf bundle/rootfs/etc/resolv.conf
          
          sudo mount --bind /dev bundle/rootfs/dev
          sudo mount --bind /dev/pts bundle/rootfs/dev/pts
          sudo mount -t proc proc bundle/rootfs/proc
          sudo mount -t sysfs sys bundle/rootfs/sys

      - name: Install System Dependencies & Build Tools
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            
            # Ensure proper Alpine repository mirrors are configured
            echo 'https://dl-cdn.alpinelinux.org/alpine/v3.22/main' > /etc/apk/repositories
            echo 'https://dl-cdn.alpinelinux.org/alpine/v3.22/community' >> /etc/apk/repositories
            
            apk update
            
            # Explicitly install all required system runtime libraries matching Node.js requirements
            apk add --no-cache \
              coreutils \
              nodejs \
              npm \
              tini \
              curl \
              jq \
              tzdata \
              ca-certificates \
              bash \
              file \
              avahi-compat-libdns_sd \
              libstdc++ \
              libgcc \
              musl \
              zlib \
              libuv \
              openssl \
              sqlite-libs \
              icu \
              icu-libs \
              icu-data-full \
              brotli-libs \
              c-ares \
              openssh-client \
              ffmpeg \
              python3 \
              make \
              g++ \
              git \
              linux-headers \
              shadow
            
            update-ca-certificates
          "

      - name: Install Homebridge Core & UI + Bin Symlinks
        run: |
          set -euo pipefail
          echo "Installing homebridge@${HB_VER} and homebridge-config-ui-x@${UI_VER}..."
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            export NODE_ENV=production
            export HOME=/root
            export npm_config_cache=/tmp/npm-cache
            npm config set prefix /usr/local
            
            npm install -g \
              --unsafe-perm \
              --omit=dev \
              --include=optional \
              --no-audit \
              --no-fund \
              homebridge@${HB_VER} \
              homebridge-config-ui-x@${UI_VER}

            ln -sf /usr/local/bin/homebridge /usr/bin/homebridge || true
            ln -sf /usr/local/bin/hb-service /usr/bin/hb-service || true
          "

      - name: Clean npm Install Cache
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            npm cache clean --force
            rm -rf /root/.npm /tmp/npm-cache
          "

      - name: Inject Robust Compatibility Layer & Explicit Directories
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c '
            addgroup -g 1000 homebridge || true
            adduser -D -u 1000 -G homebridge -s /bin/sh homebridge || true

            mkdir -p \
              /usr/local/lib/node_modules \
              /usr/lib/node_modules \
              /etc/homebridge \
              /var/lib/homebridge/accessories \
              /var/lib/homebridge/persist \
              /var/lib/homebridge/backups \
              /var/lib/homebridge/logs \
              /run \
              /var/run \
              /homebridge \
              /var/log
            
            chown -R 1000:1000 \
              /var/lib/homebridge \
              /homebridge || true
            
            mkdir -p /root/.homebridge
            ln -sf /var/lib/homebridge/config.json /root/.homebridge/config.json || true
            ln -sf /var/lib/homebridge/accessories /root/.homebridge/accessories || true
            ln -sf /var/lib/homebridge/persist /root/.homebridge/persist || true
            
            echo "#!/bin/sh" > /usr/bin/sudo
            echo "while [ \$# -gt 0 ]; do case \"\$1\" in -*) shift ;; *) break ;; esac; done" >> /usr/bin/sudo
            echo "exec \"\$@\"" >> /usr/bin/sudo
            chmod +x /usr/bin/sudo
            ln -sf /usr/bin/sudo /bin/sudo
          '

      - name: Purge Build Dependencies
        run: |
          set -euo pipefail
          echo "Purging heavy build toolchains to minimize footprint..."
          sudo chroot bundle/rootfs /bin/sh -c "
            apk del --purge make g++ git linux-headers || true
          "

      - name: Verify Rootfs ARM64 Binaries & NPM Prefix Integrity
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            echo '--- Rootfs Architecture ---'
            file /bin/busybox
            file /bin/busybox | grep -q aarch64 || {
              echo '❌ Rootfs is not ARM64!'
              exit 1
            }
            
            echo '--- Homebridge User Check ---'
            id homebridge
            
            echo '--- Node Architecture Verification ---'
            NODE_ARCH=\$(node -p \"process.arch\")
            echo \"Detected Node architecture: \${NODE_ARCH}\"
            test \"\${NODE_ARCH}\" = \"arm64\" || { echo '❌ Node architecture mismatch!'; exit 1; }
            
            echo '--- Tini Binary Check ---'
            which tini
            tini --version
            
            echo '--- Node & NPM Binaries Check ---'
            which node
            which npm
            file \$(which node)
            
            echo '--- NPM Prefix & Root Verification ---'
            npm config get prefix
            npm root -g
            
            test \"\$(npm config get prefix)\" = \"/usr/local\" || { echo '❌ NPM prefix is incorrect!'; exit 1; }
            
            echo '--- Global NPM Modules Tree ---'
            npm list -g --depth=0
            
            echo '--- Module Existence Validation ---'
            test -d /usr/local/lib/node_modules/homebridge
            test -d /usr/local/lib/node_modules/homebridge-config-ui-x
          "

      - name: Initialize OCI Runtime Directories & Timezone
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            mkdir -p \
              /run \
              /var/run \
              /homebridge \
              /var/lib/homebridge/accessories \
              /var/lib/homebridge/persist \
              /var/lib/homebridge/backups \
              /var/lib/homebridge/logs \
              /var/log \
              /etc/homebridge
            chown -R 1000:1000 \
              /var/lib/homebridge \
              /homebridge || true
            cp /usr/share/zoneinfo/UTC /etc/localtime
            echo UTC >/etc/timezone
          "

      - name: Health Checks & Deep Footprint Optimization
        run: |
          set -euo pipefail
          sudo chroot bundle/rootfs /bin/sh -c "
            set -eu
            export NODE_ENV=production
            export HOME=/root
            export LANG=C.UTF-8
            export LC_ALL=C.UTF-8
            export NODE_PATH=/usr/local/lib/node_modules
            
            echo '--- Running Health Checks & Module Requires ---'
            node -v
            npm -v
            homebridge --version
            
            node -e \"require('homebridge')\"
            node -e \"require('homebridge-config-ui-x')\"
            
            command -v hb-service
            test -x /usr/local/bin/hb-service
            hb-service --help >/dev/null
            
            echo '--- OCI Runtime Smoke Test ---'
            mkdir -p /tmp/hb-test
            chown -R 1000:1000 /tmp/hb-test
            
            su -s /bin/sh homebridge -c '
              export HOME=/var/lib/homebridge
              export NODE_ENV=production
              export LANG=C.UTF-8
              export LC_ALL=C.UTF-8
              /usr/local/bin/homebridge -U /tmp/hb-test --user-storage-path /tmp/hb-test --no-qrcode
            ' &
            HB_PID=\$!
            
            sleep 10
            
            kill -0 \"\$HB_PID\" && echo '✅ Homebridge daemon started successfully'
            
            kill \"\$HB_PID\" || true
            wait \"\$HB_PID\" || true
            
            rm -rf /tmp/hb-test
            
            echo '--- Purging Documentation & Temp Files ---'
            rm -rf /usr/lib/node_modules/npm/docs
            rm -rf /usr/lib/node_modules/npm/html
            rm -rf /usr/local/lib/node_modules/npm/man
            rm -rf /usr/share/man /usr/share/doc /usr/share/info
            find /usr/local/lib/node_modules -type f -name \"*.md\" -delete
            rm -rf /var/cache/apk/*
            find /tmp -mindepth 1 -delete
            find /var/tmp -mindepth 1 -delete
          "

      - name: Resolve Dynamic Release Version Tag
        run: |
          set -euo pipefail
          HB_VERSION=$(sudo chroot bundle/rootfs /bin/sh -c 'homebridge --version' | tr -d '\r\n')
          RELEASE_TAG="$(date +'%Y.%m.%d-%H%M')-hb${HB_VERSION}"
          echo "VERSION=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "RESOLVED_HB_VER=${HB_VERSION}" >> $GITHUB_ENV

      - name: Generate Build Summary Report
        run: |
          set -euo pipefail
          NODE_VER=$(sudo chroot bundle/rootfs /bin/sh -c 'node -v')
          NPM_VER=$(sudo chroot bundle/rootfs /bin/sh -c 'npm -v')
          
          {
            echo "### 🚀 Homebridge UXC Build Manifest"
            echo "| Component | Version / Target |"
            echo "| :--- | :--- |"
            echo "| **OS Base** | Alpine Linux ${ALPINE_VER} (ARM64) |"
            echo "| **Node.js** | ${NODE_VER} |"
            echo "| **npm** | v${NPM_VER} |"
            echo "| **Homebridge** | v${RESOLVED_HB_VER} |"
            echo "| **Config UI X** | Target: ${UI_VER} |"
            echo "| **Release Tag** | \`${VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Host Mounts & Verify
        if: always()
        run: |
          set -euo pipefail
          sudo umount bundle/rootfs/dev/pts || true
          sudo umount bundle/rootfs/dev || true
          sudo umount bundle/rootfs/proc || true
          sudo umount bundle/rootfs/sys || true
          
          test -f bundle/config.template.json || (echo '❌ Missing config.template.json!' && exit 1)

      - name: Stage Production OCI Config & Validate JSON
        run: |
          set -euo pipefail
          echo "Copying config.template.json -> config.json..."
          cp bundle/config.template.json bundle/config.json
          
          echo "Validating OCI config.json structure with JQ..."
          jq empty bundle/config.json || { echo '❌ Invalid JSON in config.json!'; exit 1; }
          echo "✅ OCI JSON syntax validated successfully."

      - name: Validate Rootfs Runtime & Shared Libraries
        run: |
          set -euo pipefail
          
          sudo chroot bundle/rootfs node -v
          sudo chroot bundle/rootfs npm --version
          sudo chroot bundle/rootfs homebridge --version
          
          echo '--- Checking Dynamic Linker Dependencies ---'
          if sudo chroot bundle/rootfs ldd /usr/bin/node | tee /dev/stderr | grep -q "not found"; then
            echo "❌ Missing shared libraries for node!"
            exit 1
          fi
          
          if sudo chroot bundle/rootfs ldd /usr/local/bin/hb-service | tee /dev/stderr | grep -q "not found"; then
            echo "❌ Missing shared libraries for hb-service!"
            exit 1
          fi
          
          sudo chroot bundle/rootfs which hb-service
          test -x bundle/rootfs/usr/local/bin/hb-service
          
          echo "✅ Rootfs runtime & library validation passed"

      - name: Package Deterministic OCI Bundle
        run: |
          set -euo pipefail
          echo "Compressing bundle payload deterministically..."
          cd bundle
          sudo tar \
            --sort=name \
            --mtime='UTC 2026-01-01' \
            --numeric-owner \
            --owner=0 \
            --group=0 \
            --pax-option=delete=atime,delete=ctime \
            -czf ../homebridge-arm64.tar.gz config.json rootfs
            
      - name: Generate Integrity Checksum
        run: |
          set -euo pipefail
          sha256sum homebridge-arm64.tar.gz > SHA256SUMS
          echo "✅ Checksum generated:"
          cat SHA256SUMS
            
      - name: Validate Bundle Archive
        run: |
          set -euo pipefail
          test -s homebridge-arm64.tar.gz
          ARCHIVE_FILES=$(tar -tf homebridge-arm64.tar.gz)
          
          [[ "$ARCHIVE_FILES" =~ rootfs ]] || { echo "❌ 'rootfs' missing from archive!"; exit 1; }
          [[ "$ARCHIVE_FILES" =~ config.json ]] || { echo "❌ 'config.json' missing from archive!"; exit 1; }
          
          echo "✅ Bundle archive validated successfully."

      - name: Upload Build Artifacts (Debug Backup)
        uses: actions/upload-artifact@v4
        with:
          name: homebridge-arm64-bundle
          path: |
            homebridge-arm64.tar.gz
            SHA256SUMS
          retention-days: 7

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Homebridge UXC Base - ${{ env.VERSION }}"
          body: |
            ### 🚀 Automated Native ARM64 Build
            Deterministic, immutable UXC bundle for OpenWrt.
            - **OS Base:** Alpine Linux ${{ env.ALPINE_VER }} (aarch64)
            - **Core Tools:** Node.js, npm, Tini, coreutils, bash, shadow, robust-sudo, openssh-client
            - **App Versions:** `homebridge@${{ env.RESOLVED_HB_VER }}`, `homebridge-config-ui-x@${{ env.UI_VER }}`
          files: |
            homebridge-arm64.tar.gz
            SHA256SUMS
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
