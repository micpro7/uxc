```yaml
name: Build Homebridge UXC ARM64 Bundle

on:
  workflow_dispatch:
    inputs:
      homebridge_version:
        description: Homebridge version
        required: false
        default: latest
      config_ui_version:
        description: Config UI X version
        required: false
        default: latest

  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

jobs:
  build:
    name: Build ARM64 UXC Bundle
    runs-on: ubuntu-24.04-arm

    env:
      BUNDLE_NAME: homebridge-arm64.tar.gz
      HB_VERSION: ${{ github.event.inputs.homebridge_version || 'latest' }}
      UI_VERSION: ${{ github.event.inputs.config_ui_version || 'latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            curl \
            wget \
            jq \
            tar \
            gzip \
            rsync \
            nodejs \
            npm

      - name: Create bundle directories
        run: |
          mkdir -p bundle/rootfs
          mkdir -p bundle/rootfs/homebridge

      - name: Download Alpine ARM64 rootfs
        run: |
          wget -q \
            https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/alpine-minirootfs-latest-aarch64.tar.gz \
            -O alpine.tar.gz

          tar -xzf alpine.tar.gz -C bundle/rootfs

      - name: Install Homebridge into rootfs
        run: |
          sudo chroot bundle/rootfs /bin/sh -c "
            apk update &&
            apk add \
              nodejs \
              npm \
              tini \
              ca-certificates \
              avahi \
              dbus \
              bash
          "

          sudo chroot bundle/rootfs /bin/sh -c "
            npm install -g \
              homebridge@${HB_VERSION} \
              homebridge-config-ui-x@${UI_VERSION}
          "

      - name: Create init script
        run: |
          cat > bundle/rootfs/init <<'EOF'
          #!/bin/sh

          mkdir -p /homebridge

          exec /sbin/tini -- \
            homebridge \
            -U /homebridge \
            -P /usr/local/lib/node_modules
          EOF

          chmod +x bundle/rootfs/init

      - name: Create OCI config
        run: |
          cat > bundle/config.json <<'EOF'
{
  "ociVersion": "1.0.2",
  "hostname": "homebridge",
  "process": {
    "terminal": true,
    "cwd": "/homebridge",
    "args": [
      "/init"
    ],
    "env": [
      "HOME=/root",
      "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
      "NODE_ENV=production",
      "NODE_OPTIONS=--max-old-space-size=256",
      "HOMEBRIDGE_CONFIG_UI=1",
      "HOMEBRIDGE_CONFIG_UI_HOST=0.0.0.0"
    ],
    "user": {
      "uid": 0,
      "gid": 0
    }
  },
  "root": {
    "path": "rootfs",
    "readonly": false
  },
  "mounts": [
    {
      "destination": "/proc",
      "type": "proc",
      "source": "proc"
    },
    {
      "destination": "/dev",
      "type": "tmpfs",
      "source": "tmpfs"
    },
    {
      "destination": "/sys",
      "type": "sysfs",
      "source": "sysfs"
    }
  ],
  "linux": {
    "namespaces": [
      {
        "type": "pid"
      },
      {
        "type": "network"
      },
      {
        "type": "ipc"
      },
      {
        "type": "uts"
      },
      {
        "type": "mount"
      }
    ]
  }
}
EOF

      - name: Validate bundle
        run: |
          test -f bundle/config.json
          test -f bundle/rootfs/init
          test -d bundle/rootfs/usr/local/lib/node_modules/homebridge

      - name: Package bundle
        run: |
          tar -czf "$BUNDLE_NAME" bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Homebridge UXC ARM64 Latest
          files: |
            homebridge-arm64.tar.gz
```
